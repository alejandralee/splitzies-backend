openapi: 3.0.3
info:
  title: Splitzies API
  description: API for splitting receipts and assigning items to users
  version: 1.0.0
  contact:
    name: Splitzies

servers:
  - url: https://splitzies-backend-b74f565207ff.herokuapp.com
    description: Production
  - url: http://localhost:8080
    description: Local development

paths:
  /receipts/image:
    post:
      summary: Upload receipt image
      description: |
        Upload a receipt image for OCR processing. The image is stored in GCS,
        OCR is performed to extract text, and items are parsed using Gemini.
        Returns the receipt ID, image URL, and parsed items.
      operationId: uploadReceiptImage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                  description: Receipt image file (JPEG, PNG, GIF, or WebP, max 10MB)
      responses:
        '201':
          description: Receipt uploaded and processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadReceiptResponse'
        '400':
          description: Invalid request (missing image, unsupported file type, file too large)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /receipts/{receipt_id}:
    get:
      summary: Get full receipt with bill split data
      description: |
        Returns the receipt with users, items, and assignments. Each assignment
        links a user to an item and includes amount_owed, computed as an equal
        split among all users assigned to that item (rounded to whole cents).
      operationId: getReceipt
      parameters:
        - $ref: '#/components/parameters/receipt_id'
      responses:
        '200':
          description: Receipt with users, items, and assignments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetReceiptResponse'
        '404':
          description: Receipt not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update receipt tax and tip
      description: |
        Update tax and/or tip on a receipt. Use when values were not parsed
        from the receipt during upload. Only provided fields are updated.
      operationId: patchReceipt
      parameters:
        - $ref: '#/components/parameters/receipt_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchReceiptRequest'
      responses:
        '200':
          description: Receipt updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "receipt updated successfully"
        '400':
          description: Invalid request (must include at least one of tax or tip)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Receipt not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /receipts/{receipt_id}/users:
    get:
      summary: Get users on a receipt
      description: List all users/participants associated with a receipt.
      operationId: getReceiptUsers
      parameters:
        - $ref: '#/components/parameters/receipt_id'
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetReceiptUsersResponse'
        '404':
          description: Receipt not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Add user to receipt
      description: Add a participant to a receipt for bill splitting.
      operationId: addUserToReceipt
      parameters:
        - $ref: '#/components/parameters/receipt_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddUserToReceiptRequest'
      responses:
        '201':
          description: User added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddUserToReceiptResponse'
        '400':
          description: Invalid request (missing name)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Receipt not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /receipts/{receipt_id}/items:
    get:
      summary: Get items on a receipt
      description: List all line items on a receipt.
      operationId: getReceiptItems
      parameters:
        - $ref: '#/components/parameters/receipt_id'
      responses:
        '200':
          description: List of receipt items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetReceiptItemsResponse'
        '404':
          description: Receipt not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /receipts/{receipt_id}/users/{user_id}/items:
    post:
      summary: Assign items to a user
      description: |
        Assign one or more receipt items to a user. Amounts owed are computed
        as an equal split among all users assigned to each item. Re-posting
        an already-assigned item updates the assignment (upsert).
      operationId: assignItemsToUser
      parameters:
        - $ref: '#/components/parameters/receipt_id'
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: Receipt user ID (from add user response)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignItemsToUserRequest'
      responses:
        '201':
          description: Items assigned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignItemsToUserResponse'
        '400':
          description: Invalid request (item_ids must not be empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User or item not found, or they belong to different receipts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  parameters:
    receipt_id:
      name: receipt_id
      in: path
      required: true
      schema:
        type: string
      description: Receipt ID (ULID)

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message
          example: "receipt \"01J...\" not found"
        code:
          type: string
          description: Machine-readable error code
          example: "receipt_not_found"
        request_id:
          type: string
          description: Request ID from X-Request-Id header (when provided)
          example: "f5542cdd-b900-260c-591c-c771cf2df890"

    MoneyAmount:
      type: number
      format: double
      description: |
        Monetary amount serialized as a plain decimal number with currency-aware
        precision (e.g. 2 decimal places for USD, 0 for JPY).
      example: 12.95

    ReceiptItem:
      type: object
      properties:
        id:
          type: string
          description: Item ID (ULID)
        name:
          type: string
          description: Item name
        quantity:
          type: integer
          description: Quantity
        total_price:
          $ref: '#/components/schemas/MoneyAmount'
          nullable: true
        price_per_item:
          $ref: '#/components/schemas/MoneyAmount'
          nullable: true

    UploadReceiptResponse:
      type: object
      properties:
        receipt_id:
          type: string
          description: Receipt ID — use this for all subsequent calls
          example: "01J8K2M3N4P5Q6R7S8T9V0W1X2"
        image_url:
          type: string
          format: uri
          description: GCS URL of the uploaded image
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReceiptItem'
          description: Line items parsed from OCR/Gemini (may be empty if OCR found nothing)
        ocr_text:
          type: string
          description: Raw OCR text, included when available
        tax:
          $ref: '#/components/schemas/MoneyAmount'
          nullable: true
          description: Tax amount parsed from receipt (null if not detected)
        tip:
          $ref: '#/components/schemas/MoneyAmount'
          nullable: true
          description: Tip amount parsed from receipt (null if not detected)

    AddUserToReceiptRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Participant name
          example: "Alice"

    AddUserToReceiptResponse:
      type: object
      properties:
        message:
          type: string
          example: "user added to receipt successfully"
        user:
          type: object
          properties:
            id:
              type: string
              description: Receipt user ID — use this when assigning items
            receipt_id:
              type: string
            name:
              type: string

    GetReceiptUsersResponse:
      type: object
      properties:
        users:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              receipt_id:
                type: string
              name:
                type: string
              user_total:
                $ref: '#/components/schemas/MoneyAmount'
                nullable: true
                description: Total amount owed by this user (omitted when no assignments exist)

    GetReceiptItemsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReceiptItem'

    GetReceiptResponse:
      type: object
      description: Full receipt with users, items, and computed bill split assignments
      properties:
        receipt_id:
          type: string
        users:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              receipt_id:
                type: string
              name:
                type: string
              user_total:
                $ref: '#/components/schemas/MoneyAmount'
                nullable: true
                description: Sum of amount_owed across all items assigned to this user
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReceiptItem'
        assignments:
          type: array
          description: |
            User-item correlations for the bill split. amount_owed is an equal
            share of the item's total_price among all assigned users, rounded
            to whole cents (remainders distributed to earlier assignees).
          items:
            type: object
            properties:
              id:
                type: string
              user_id:
                type: string
              item_id:
                type: string
              amount_owed:
                $ref: '#/components/schemas/MoneyAmount'

    AssignItemsToUserRequest:
      type: object
      required:
        - item_ids
      properties:
        item_ids:
          type: array
          items:
            type: string
          minItems: 1
          description: Item IDs to assign to this user
          example: ["01J8K2M3N4P5Q6R7S8T9V0W1X2", "01J8K2M3N4P5Q6R7S8T9V0W1X3"]

    AssignItemsToUserResponse:
      type: object
      properties:
        message:
          type: string
          example: "successfully assigned 2 item(s) to user"
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Assignment ID
              receipt_user_id:
                type: string
              receipt_item_id:
                type: string

    PatchReceiptRequest:
      type: object
      description: At least one of tax or tip must be provided
      minProperties: 1
      properties:
        tax:
          type: number
          format: double
          nullable: true
          description: Sales tax amount
          example: 1.50
        tip:
          type: number
          format: double
          nullable: true
          description: Tip/gratuity amount
          example: 5.00
