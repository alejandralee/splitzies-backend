openapi: 3.0.3
info:
  title: Splitzies API
  description: API for splitting receipts and assigning items to users
  version: 1.0.0
  contact:
    name: Splitzies

servers:
  - url: https://splitzies-backend-b74f565207ff.herokuapp.com
    description: Production
  - url: http://localhost:8080
    description: Local development

paths:
  /devices:
    post:
      summary: Create an anonymous device identity
      description: |
        Mints an anonymous identity so a user gets bill history without creating
        an account. The returned `device_token` is shown **once** — only its hash
        is stored — so the client must persist it (e.g. localStorage) and send it
        as the `X-Device-Token` header on subsequent requests. Losing the token
        loses that device's history.

        Every other endpoint treats the header as optional: a request without it
        behaves exactly as it did before devices existed.
      operationId: createDevice
      responses:
        '201':
          description: Device created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateDeviceResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me/receipts:
    get:
      summary: List this device's bill history
      description: |
        Returns bills this device created or joined, newest first. Summary rows
        only — fetch `GET /receipts/{receipt_id}` for items and assignments.
        `your_total` is present when the device has claimed a participant.
      operationId: listMyReceipts
      parameters:
        - $ref: '#/components/parameters/device_token'
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            format: date-time
          description: The `next_cursor` from the previous page (RFC3339).
      responses:
        '200':
          description: The device's bill history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListMyReceiptsResponse'
        '400':
          description: Invalid limit or cursor
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Missing or unknown X-Device-Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /me/receipts/{receipt_id}:
    delete:
      summary: Remove a bill from this device's history
      description: |
        Hides the bill from this device only. The receipt itself and the other
        participants' history are untouched — a shared bill is not any one
        person's to delete.
      operationId: deleteMyReceipt
      parameters:
        - $ref: '#/components/parameters/receipt_id'
        - $ref: '#/components/parameters/device_token'
      responses:
        '200':
          description: Removed from history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Missing or unknown X-Device-Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Receipt is not in this device's history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /receipts/{receipt_id}/share:
    post:
      summary: Create or fetch the receipt's share link
      description: |
        Returns a link that friends can open to edit the bill — no account
        required. Render `url` as a QR code and offer it as "copy link".

        Idempotent: repeat calls return the same active link, so re-opening the
        share sheet shows a stable QR code instead of invalidating one already
        sent. Anyone holding the link has full edit access to the bill.
      operationId: createShareLink
      parameters:
        - $ref: '#/components/parameters/receipt_id'
        - $ref: '#/components/parameters/device_token_optional'
      responses:
        '201':
          description: The receipt's active share link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShareLinkResponse'
        '404':
          description: Receipt not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      summary: Revoke the receipt's share link
      description: |
        Deactivates the link. Friends who already joined keep their access and
        the bill stays in their history — only the link stops working. A later
        POST mints a fresh link with a new token.
      operationId: revokeShareLink
      parameters:
        - $ref: '#/components/parameters/receipt_id'
      responses:
        '200':
          description: Share link revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: The receipt has no active share link
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /join/{token}:
    post:
      summary: Open a shared bill
      description: |
        Resolves a share token to its receipt and, when `X-Device-Token` is sent,
        adds the bill to that device's history (`joined: true`). Without a device
        token the caller can still edit the receipt — it just won't appear in any
        history. Use the returned `receipt_id` with the normal receipt endpoints.
      operationId: joinShareLink
      parameters:
        - name: token
          in: path
          required: true
          schema:
            type: string
          description: Share token from the share link URL
        - $ref: '#/components/parameters/device_token_optional'
      responses:
        '200':
          description: Share link resolved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JoinShareLinkResponse'
        '404':
          description: The share link is invalid or has been revoked
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /receipts/{receipt_id}/users/{user_id}/claim:
    post:
      summary: Claim an existing participant as this device
      description: |
        Links an already-created participant to the calling device, for the case
        where the organiser typed everyone's names in before sharing the link.
        The claim shows up as `device_id` on that user in `GET /receipts/{id}`,
        which is how a client recognises which participant is itself. A device
        may claim at most one participant per receipt.

        To create *and* claim a participant in one call, post to
        `/receipts/{receipt_id}/users` with `claim: true` instead.
      operationId: claimReceiptUser
      parameters:
        - $ref: '#/components/parameters/receipt_id'
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: Receipt user ID to claim
        - $ref: '#/components/parameters/device_token'
      responses:
        '200':
          description: Participant claimed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          description: Missing or unknown X-Device-Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Participant not found on this receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: This device already claims another participant on the receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /receipts/image:
    post:
      summary: Upload receipt image
      description: |
        Upload a receipt image for OCR processing. The image is stored in GCS,
        OCR is performed to extract text, and items are parsed using Gemini.
        Returns the receipt ID, image URL, and parsed items.
      operationId: uploadReceiptImage
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - image
              properties:
                image:
                  type: string
                  format: binary
                  description: Receipt image file (JPEG, PNG, GIF, or WebP, max 10MB)
      responses:
        '201':
          description: Receipt uploaded and processed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadReceiptResponse'
        '400':
          description: Invalid request (missing image, unsupported file type, file too large)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /receipts/{receipt_id}:
    get:
      summary: Get full receipt with bill split data
      description: |
        Returns the receipt with users, items, and assignments. Each assignment
        links a user to an item and includes amount_owed, computed as an equal
        split among all users assigned to that item (rounded to whole cents).

        **Polling for collaborators' edits.** This endpoint is conditional. Every
        response carries an `ETag` derived from a receipt version that every
        mutation bumps. Poll every few seconds sending the last `ETag` back as
        `If-None-Match`: an unchanged bill answers `304 Not Modified` after a
        single row read, and a changed one answers `200` with a new tag. Browser
        clients can read the header because `ETag` is in
        `Access-Control-Expose-Headers`.
      operationId: getReceipt
      parameters:
        - $ref: '#/components/parameters/receipt_id'
        - name: If-None-Match
          in: header
          required: false
          schema:
            type: string
          description: ETag from the previous response, e.g. `"v7"`.
      responses:
        '200':
          description: Receipt with users, items, and assignments
          headers:
            ETag:
              schema:
                type: string
              description: Receipt version, e.g. `"v7"`. Send back as If-None-Match.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetReceiptResponse'
        '304':
          description: The receipt has not changed since the supplied ETag
          headers:
            ETag:
              schema:
                type: string
        '404':
          description: Receipt not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      summary: Update receipt tax, tip, and/or extras_mode
      description: |
        Update tax, tip, and/or extras_mode on a receipt. Use tax/tip when
        values were not parsed from the receipt during upload. Only provided
        fields are updated.
      operationId: patchReceipt
      parameters:
        - $ref: '#/components/parameters/receipt_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchReceiptRequest'
      responses:
        '200':
          description: Receipt updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: "receipt updated successfully"
        '400':
          description: Invalid request (must include at least one of tax, tip, or extras_mode; extras_mode must be proportional or even)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Receipt not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /receipts/{receipt_id}/users:
    get:
      summary: Get users on a receipt
      description: List all users/participants associated with a receipt.
      operationId: getReceiptUsers
      parameters:
        - $ref: '#/components/parameters/receipt_id'
      responses:
        '200':
          description: List of users
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetReceiptUsersResponse'
        '404':
          description: Receipt not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Add user to receipt
      description: |
        Add a participant to a receipt for bill splitting.

        Set `claim: true` (with an `X-Device-Token` header) to link the new
        participant to the calling device — this is what a friend does after
        opening a share link, and it makes the bill appear in their history.
        Leave it unset when typing in other people's names.
      operationId: addUserToReceipt
      parameters:
        - $ref: '#/components/parameters/receipt_id'
        - $ref: '#/components/parameters/device_token_optional'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddUserToReceiptRequest'
      responses:
        '201':
          description: User added successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddUserToReceiptResponse'
        '400':
          description: Invalid request (missing name)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: claim was requested without a valid X-Device-Token
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Receipt not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: This device already claims a participant on the receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /receipts/{receipt_id}/users/{user_id}:
    delete:
      summary: Remove a participant from a receipt
      description: |
        Removes a participant from the bill. Their item assignments are deleted
        with them, so anything only they had claimed becomes unclaimed again.
      operationId: removeUserFromReceipt
      parameters:
        - $ref: '#/components/parameters/receipt_id'
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: Receipt user ID to remove
      responses:
        '200':
          description: Participant removed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Participant not found on this receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /receipts/{receipt_id}/items:
    get:
      summary: Get items on a receipt
      description: List all line items on a receipt.
      operationId: getReceiptItems
      parameters:
        - $ref: '#/components/parameters/receipt_id'
      responses:
        '200':
          description: List of receipt items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetReceiptItemsResponse'
        '404':
          description: Receipt not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      summary: Add a unit to a receipt
      description: |
        Creates one individually-assignable unit. Pass group_id to add a unit
        to an existing group (the quantity stepper's "+"), or omit it to start
        a new group with this unit as its first member.
      operationId: createReceiptItem
      parameters:
        - $ref: '#/components/parameters/receipt_id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReceiptItemRequest'
      responses:
        '201':
          description: Item created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceiptItem'
        '400':
          description: Invalid request (missing name/amount when group_id is not set)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Receipt or group not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /receipts/{receipt_id}/items/{item_id}:
    delete:
      summary: Delete a unit from a receipt
      description: |
        Deletes a single unit; its assignments are deleted with it. If it was
        the last unit in its group, the now-empty group is removed too.
      operationId: deleteReceiptItem
      parameters:
        - $ref: '#/components/parameters/receipt_id'
        - name: item_id
          in: path
          required: true
          schema:
            type: string
          description: Receipt item ID to delete
      responses:
        '200':
          description: Item deleted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '404':
          description: Item not found on this receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /receipts/{receipt_id}/item-groups/{group_id}:
    patch:
      summary: Update a group's name and/or unit price
      description: |
        Updates apply to every unit in the group at once, since the review
        screen edits name and price per group rather than per unit.
      operationId: patchReceiptItemGroup
      parameters:
        - $ref: '#/components/parameters/receipt_id'
        - name: group_id
          in: path
          required: true
          schema:
            type: string
          description: Item group ID to update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchReceiptItemGroupRequest'
      responses:
        '200':
          description: Item group updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Invalid request (must include at least one of name or amount)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Item group not found on this receipt
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /receipts/{receipt_id}/users/{user_id}/items:
    post:
      summary: Assign items to a user
      description: |
        Assign one or more receipt items to a user. Amounts owed are computed
        as an equal split among all users assigned to each item. Re-posting
        an already-assigned item updates the assignment (upsert).
      operationId: assignItemsToUser
      parameters:
        - $ref: '#/components/parameters/receipt_id'
        - name: user_id
          in: path
          required: true
          schema:
            type: string
          description: Receipt user ID (from add user response)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssignItemsToUserRequest'
      responses:
        '201':
          description: Items assigned successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AssignItemsToUserResponse'
        '400':
          description: Invalid request (item_ids must not be empty)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: User or item not found, or they belong to different receipts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  parameters:
    receipt_id:
      name: receipt_id
      in: path
      required: true
      schema:
        type: string
      description: Receipt ID (ULID)

    device_token:
      name: X-Device-Token
      in: header
      required: true
      schema:
        type: string
      description: Device token from POST /devices.

    device_token_optional:
      name: X-Device-Token
      in: header
      required: false
      schema:
        type: string
      description: |
        Device token from POST /devices. Optional — the request succeeds without
        it, but the device-linked behaviour (history, claiming) is skipped.

  schemas:
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Human-readable error message
          example: "receipt \"01J...\" not found"
        code:
          type: string
          description: Machine-readable error code
          example: "receipt_not_found"
        request_id:
          type: string
          description: Request ID from X-Request-Id header (when provided)
          example: "f5542cdd-b900-260c-591c-c771cf2df890"

    MoneyAmount:
      type: object
      description: Monetary amount with currency code and currency-aware decimal precision.
      properties:
        amount:
          type: number
          format: double
          description: Numeric value rounded to the currency's decimal places (e.g. 2 for USD, 0 for JPY).
          example: 12.95
        currency:
          type: string
          description: ISO 4217 currency code.
          example: USD
      example:
        amount: 12.95
        currency: USD

    ReceiptItem:
      type: object
      description: |
        A single, individually-assignable unit. Items sharing group_id are
        grouped for display only (e.g. 3 "Margarita" units) — assignment and
        splitting always happen per item, never per group.
      properties:
        id:
          type: string
          description: Item ID (ULID)
        group_id:
          type: string
          description: Groups units that display together (e.g. quantity 3 of the same item)
        group_name:
          type: string
          description: Display name of the group
        name:
          type: string
          description: Item name
        display_order:
          type: integer
          description: Sort order within the receipt
        amount:
          $ref: '#/components/schemas/MoneyAmount'
          nullable: true
          description: Per-unit price

    UploadReceiptResponse:
      type: object
      properties:
        receipt_id:
          type: string
          description: Receipt ID — use this for all subsequent calls
          example: "01J8K2M3N4P5Q6R7S8T9V0W1X2"
        image_url:
          type: string
          format: uri
          description: GCS URL of the uploaded image
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReceiptItem'
          description: Line items parsed from OCR/Gemini (may be empty if OCR found nothing)
        ocr_text:
          type: string
          description: Raw OCR text, included when available
        tax:
          $ref: '#/components/schemas/MoneyAmount'
          nullable: true
          description: Tax amount parsed from receipt (null if not detected)
        tip:
          $ref: '#/components/schemas/MoneyAmount'
          nullable: true
          description: Tip amount parsed from receipt (null if not detected)

    AddUserToReceiptRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          description: Participant name
          example: "Alice"
        claim:
          type: boolean
          default: false
          description: |
            Link the new participant to the calling device, so its client can
            recognise which person on the bill is itself and the bill shows up
            in its history. Requires an X-Device-Token header.

    AddUserToReceiptResponse:
      type: object
      properties:
        message:
          type: string
          example: "user added to receipt successfully"
        user:
          type: object
          properties:
            id:
              type: string
              description: Receipt user ID — use this when assigning items
            receipt_id:
              type: string
            name:
              type: string

    GetReceiptUsersResponse:
      type: object
      properties:
        users:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              receipt_id:
                type: string
              name:
                type: string
              device_id:
                type: string
                nullable: true
                description: |
                  The device acting as this participant, if one has claimed them.
                  Compare with the device_id from POST /devices to find yourself.
              user_total:
                $ref: '#/components/schemas/MoneyAmount'
                nullable: true
                description: Total amount owed by this user (omitted when no assignments exist)

    GetReceiptItemsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReceiptItem'

    GetReceiptResponse:
      type: object
      description: Full receipt with users, items, and computed bill split assignments
      properties:
        receipt_id:
          type: string
        users:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              receipt_id:
                type: string
              name:
                type: string
              device_id:
                type: string
                nullable: true
                description: |
                  The device acting as this participant, if one has claimed them.
                  Compare with the device_id from POST /devices to find yourself.
              user_total:
                $ref: '#/components/schemas/MoneyAmount'
                nullable: true
                description: Sum of amount_owed across all items assigned to this user
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReceiptItem'
        assignments:
          type: array
          description: |
            User-item correlations for the bill split. amount_owed is an equal
            share of the item's total_price among all assigned users, rounded
            to whole cents (remainders distributed to earlier assignees).
          items:
            type: object
            properties:
              id:
                type: string
              user_id:
                type: string
              item_id:
                type: string
              amount_owed:
                $ref: '#/components/schemas/MoneyAmount'
        tax:
          $ref: '#/components/schemas/MoneyAmount'
          nullable: true
        tip:
          $ref: '#/components/schemas/MoneyAmount'
          nullable: true
        extras_mode:
          type: string
          enum: [proportional, even]
          description: |
            How tax/tip should be divided among participants. proportional
            (default) divides each person's share by their claimed subtotal
            over the full item subtotal, leaving an unclaimed item's tax/tip
            unassigned; even splits tax/tip equally across all participants
            regardless of what they claimed. This is a client-side computation
            — the server only stores and returns the setting.

    AssignItemsToUserRequest:
      type: object
      required:
        - item_ids
      properties:
        item_ids:
          type: array
          items:
            type: string
          minItems: 1
          description: Item IDs to assign to this user
          example: ["01J8K2M3N4P5Q6R7S8T9V0W1X2", "01J8K2M3N4P5Q6R7S8T9V0W1X3"]

    AssignItemsToUserResponse:
      type: object
      properties:
        message:
          type: string
          example: "successfully assigned 2 item(s) to user"
        items:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
                description: Assignment ID
              receipt_user_id:
                type: string
              receipt_item_id:
                type: string

    PatchReceiptRequest:
      type: object
      description: At least one of tax, tip, or extras_mode must be provided
      minProperties: 1
      properties:
        tax:
          type: number
          format: double
          nullable: true
          description: Sales tax amount
          example: 1.50
        tip:
          type: number
          format: double
          nullable: true
          description: Tip/gratuity amount
          example: 5.00
        extras_mode:
          type: string
          enum: [proportional, even]
          description: How tax/tip should be divided among participants

    CreateReceiptItemRequest:
      type: object
      description: |
        When group_id is set, the new unit joins that existing group and
        adopts its name and price — name/amount are ignored. When group_id is
        omitted, name and amount are required and a new group is created.
      properties:
        name:
          type: string
          description: Required when group_id is not set
          example: "Margarita"
        amount:
          type: number
          format: double
          description: Required when group_id is not set
          example: 12.00
        group_id:
          type: string
          nullable: true
          description: Existing group to add this unit to

    PatchReceiptItemGroupRequest:
      type: object
      description: |
        At least one of name or amount must be provided. Applies to every unit
        in the group — the review screen edits a group's name and price as one,
        not per unit.
      minProperties: 1
      properties:
        name:
          type: string
          nullable: true
        amount:
          type: number
          format: double
          nullable: true

    MessageResponse:
      type: object
      properties:
        message:
          type: string
          example: "share link revoked"

    CreateDeviceResponse:
      type: object
      properties:
        device_id:
          type: string
          description: Device ID (ULID). Matches device_id on a claimed participant.
          example: "01J8K2M3N4P5Q6R7S8T9V0W1X2"
        device_token:
          type: string
          description: |
            Opaque secret, returned once and never again — only its hash is
            stored. Persist it and send it as X-Device-Token; losing it loses
            this device's history.

    ShareLinkResponse:
      type: object
      properties:
        receipt_id:
          type: string
        token:
          type: string
          description: Share token. Prefer `url` for anything user-facing.
        url:
          type: string
          format: uri
          description: The link to render as a QR code and offer as "copy link".
          example: "https://splitzies.base44.app/join/XXf7IbRTkp0cubQNuujAHw"
        created_at:
          type: string
          format: date-time

    JoinShareLinkResponse:
      type: object
      properties:
        receipt_id:
          type: string
          description: Use this with the normal receipt endpoints.
        joined:
          type: boolean
          description: |
            True when the bill was added to the calling device's history. False
            when no X-Device-Token was sent — the caller can still edit the bill.
        your_user_id:
          type: string
          nullable: true
          description: |
            The participant this device has already claimed on the bill, if any.
            When absent, prompt for a name and POST it with claim: true.

    ReceiptSummary:
      type: object
      description: One bill in a device's history — headline numbers only.
      properties:
        receipt_id:
          type: string
        title:
          type: string
          nullable: true
        image_url:
          type: string
          format: uri
          nullable: true
        receipt_date:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: Last time anyone edited this bill.
        role:
          type: string
          enum: [owner, member]
          description: owner if this device created the bill, member if it joined via a share link.
        participant_count:
          type: integer
        item_count:
          type: integer
          description: Number of individually-assignable item units.
        item_total:
          $ref: '#/components/schemas/MoneyAmount'
          description: Sum of all item amounts, excluding tax and tip.
        tax:
          $ref: '#/components/schemas/MoneyAmount'
          nullable: true
        tip:
          $ref: '#/components/schemas/MoneyAmount'
          nullable: true
        your_total:
          $ref: '#/components/schemas/MoneyAmount'
          nullable: true
          description: |
            What this device's claimed participant owes. Absent when the device
            has not claimed anyone on the bill.

    ListMyReceiptsResponse:
      type: object
      properties:
        receipts:
          type: array
          items:
            $ref: '#/components/schemas/ReceiptSummary'
        next_cursor:
          type: string
          format: date-time
          nullable: true
          description: Pass back as ?cursor= for the next page. Absent on the last page.
